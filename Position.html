<!doctype>
<html>
    <head>
        <title>Positioning</title>
        <style>
            div{
                right:30px;
                border:3px solid black;
            }
            div.absolute{
                position:absolute;
                left:50px;
                border:3px solid black;
            }
            div.relative{
                  position:relative;
                  left:100px;
                  border:3px solid black;
            }
        div.fixed{
            position:fixed;
            right:20px;
            width:300px;
            top:0;
            border:3px solid black;
        }
        div.sticky{
            position:sticky;
            top:1px;
            left:20px;
            width:100px;
            border:3px solid black;
        }
        </style>
    </head>
    <body>
        <h3>Position</h3>
        <div>
            div with no position property
        </div>
        <div class="sticky">
            div with sticky position property
        </div>
        <div class="relative">
            div with relative position property
            <div class="absolute">
                div with absolute property
            </div>
        </div>
        <div class="fixed">
            div with fixed position property
        </div>
